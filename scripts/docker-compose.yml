version: "3"
services:
  nexus-oss:
    image: "${NEXUS_IMAGE}:${NEXUS_VERSION}-${NEXUS_IMAGE_OS}"
    user: "${UID}:${GID}"
    ports:
      - "${NEXUS_PORT}:8081"
    volumes:
      - "${PWD}/oss-nexus.properties:/nexus-data/etc/nexus.properties:ro"
    profiles:
      - oss
  nexus-pro:
    image: "${NEXUS_IMAGE}:${NEXUS_VERSION}-${NEXUS_IMAGE_OS}"
    user: "${UID}:${GID}"
    ports:
      - "${NEXUS_PORT}:8081"
    volumes:
      - "${PWD}/pro-nexus.properties:/nexus-data/etc/nexus.properties:ro"
      - "${PWD}/license.lic:/nexus-data/etc/license.lic:ro"
    profiles:
      - pro
  minio:
    # minio/minio was pulled from Docker Hub entirely (and the official
    # replacements on quay.io/ghcr.io/Bitnami now require a license token),
    # so this uses localstack's S3 emulation as a free, no-account drop-in
    # S3 endpoint instead. Pinned below the version that started requiring
    # LOCALSTACK_AUTH_TOKEN even for community features.
    image: "localstack/localstack:3.8.1"
    ports:
      - "9000:9000"
    environment:
      - SERVICES=s3
      - GATEWAY_LISTEN=0.0.0.0:9000
